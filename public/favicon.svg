<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M50 5 L85 20 V55 C85 75 50 95 50 95 C50 95 15 75 15 55 V20 Z"
    fill="url(#grad)"
  />

  <!-- Lock body -->
  <rect x="35" y="45" width="30" height="28" rx="4" fill="#ffffff"/>

  <!-- Lock shackle -->
  <path
    d="M40 45 V38 C40 30 60 30 60 38 V45"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Keyhole -->
  <circle cx="50" cy="58" r="3" fill="#4f46e5"/>
  <rect x="49" y="61" width="2" height="6" fill="#4f46e5"/>
</svg>
